<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scotland Whisky Trails</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#FFFFFF;--off-white:#F8F7F4;--stone:#EAE6DF;--mist:#D4CFC6;
  --slate:#8A8680;--peat:#4A4640;--dark:#1C1A18;
  --green-light:#E8EDE6;--green-mid:#7A9B76;--green-deep:#3D6B47;
  --amber:#C4862A;--amber-light:#E8C97A;--amber-pale:#FBF3E2;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --shadow-soft:0 4px 24px rgba(28,26,24,0.08);
  --shadow-card:0 2px 12px rgba(28,26,24,0.10);
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;font-family:var(--font-body);background:var(--off-white);color:var(--dark);overflow-x:hidden}
#root{height:100%}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--mist);border-radius:3px}

/* HERO */
.hero{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(28,26,24,0.2) 0%,rgba(28,26,24,0.45) 50%,rgba(28,26,24,0.65) 100%)}
.hero-nav{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:28px 48px}
.hero-nav-links{display:flex;gap:32px}
.hero-nav-links a{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.85);text-decoration:none;transition:color 0.2s}
.hero-nav-links a:hover{color:white}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.hero-tagline{font-family:var(--font-display);font-size:clamp(42px,6vw,80px);font-weight:300;color:white;line-height:1.1;letter-spacing:-0.01em;opacity:0;transition:opacity 1.2s var(--ease-out),transform 1.2s var(--ease-out);transform:translateY(12px)}
.hero-tagline.visible{opacity:1;transform:translateY(0)}
.hero-tagline em{font-style:italic;font-weight:300;color:var(--amber-light)}
.hero-question{font-family:var(--font-display);font-size:clamp(22px,3vw,36px);font-weight:300;color:rgba(255,255,255,0.92);margin-top:48px;letter-spacing:0.01em;opacity:0;transition:opacity 1.0s var(--ease-out),transform 1.0s var(--ease-out);transform:translateY(8px)}
.hero-question.visible{opacity:1;transform:translateY(0)}
.hero-options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px;opacity:0;transition:opacity 0.8s var(--ease-out)}
.hero-options.visible{opacity:1}
.hero-option{padding:12px 24px;border-radius:100px;border:1px solid rgba(255,255,255,0.45);background:rgba(255,255,255,0.10);backdrop-filter:blur(8px);color:white;font-family:var(--font-body);font-size:14px;font-weight:400;cursor:pointer;transition:all 0.2s;letter-spacing:0.01em}
.hero-option:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.7);transform:translateY(-1px)}
.hero-option.selected{background:var(--amber);border-color:var(--amber);color:white}
.scroll-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity 0.8s;pointer-events:none}
.scroll-hint.visible{opacity:1}
.scroll-hint.hidden{opacity:0}
.chevron-anim{width:20px;height:20px;border-right:1.5px solid rgba(255,255,255,0.6);border-bottom:1.5px solid rgba(255,255,255,0.6);transform:rotate(45deg);animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0);opacity:0.5}50%{transform:rotate(45deg) translateY(4px);opacity:1}}

/* JOURNEY MODE */
.journey-screen{min-height:100vh;background:var(--off-white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 48px}
.journey-header{text-align:center;margin-bottom:56px}
.journey-eyebrow{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:16px}
.journey-title{font-family:var(--font-display);font-size:clamp(32px,4vw,52px);font-weight:300;color:var(--dark);line-height:1.15;letter-spacing:-0.01em}
.journey-title em{font-style:italic;color:var(--amber)}
.progress-dots{display:flex;gap:10px;justify-content:center;margin-bottom:48px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mist);transition:all 0.3s var(--ease-out)}
.dot.active{background:var(--green-deep);transform:scale(1.2)}
.dot.done{background:var(--green-mid)}
.q-cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:720px;width:100%}
.q-card{padding:16px 28px;border-radius:var(--radius);border:1.5px solid var(--stone);background:white;font-family:var(--font-body);font-size:15px;font-weight:400;color:var(--peat);cursor:pointer;transition:all 0.2s var(--ease-out);box-shadow:var(--shadow-card)}
.q-card:hover{border-color:var(--green-mid);color:var(--green-deep);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.q-card.selected{border-color:var(--green-deep);background:var(--green-light);color:var(--green-deep);font-weight:500}
.q-card.interest-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 20px;min-width:120px;text-align:center}
.q-card.interest-card .card-icon{font-size:24px}
.q-card.interest-card .card-label{font-size:13px}
.journey-next-btn{margin-top:40px;padding:16px 48px;background:var(--green-deep);color:white;border:none;border-radius:100px;font-family:var(--font-body);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.2s;letter-spacing:0.02em}
.journey-next-btn:hover{background:var(--peat);transform:translateY(-1px);box-shadow:0 6px 20px rgba(61,107,71,0.3)}
.journey-next-btn:disabled{opacity:0.4;cursor:default;transform:none}
.journey-back{margin-top:20px;background:none;border:none;color:var(--slate);font-size:13px;cursor:pointer;font-family:var(--font-body);letter-spacing:0.04em;text-decoration:underline;text-underline-offset:3px}
.journey-nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px 48px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--stone)}
.journey-nav-logo{font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--dark);display:flex;align-items:center;gap:8px}

/* WORKSPACE */
.workspace-root{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.workspace-main{display:flex;flex:1;overflow:hidden}
.workspace-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* BACK TO MAP BAR */
.back-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--dark);color:white;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.back-bar:hover{background:var(--peat)}
.back-bar-text{font-size:13px;font-weight:500;letter-spacing:0.02em}
.back-bar-stops{font-size:11px;background:var(--amber);padding:2px 8px;border-radius:100px;margin-left:4px}

/* LEFT PANEL */
.journey-panel{width:320px;min-width:320px;background:white;border-right:1px solid var(--stone);display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(28,26,24,0.06);z-index:20;overflow:hidden}
.panel-header{padding:24px 24px 16px;border-bottom:1px solid var(--stone);background:white}
.panel-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:6px}
.panel-title{font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--dark);line-height:1.2}
.panel-subtitle{font-size:12px;color:var(--slate);margin-top:4px}
.journey-stops{flex:1;overflow-y:auto;padding:16px}
.journey-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--slate);text-align:center;gap:12px}
.journey-empty-icon{font-size:36px;opacity:0.4}
.journey-empty p{font-size:13px;line-height:1.6;max-width:200px}
.journey-stop{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--stone);animation:slideIn 0.3s var(--ease-out)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.stop-number{width:28px;height:28px;border-radius:50%;background:var(--green-deep);color:white;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:14px;font-weight:500;color:var(--dark)}
.stop-region{font-size:11px;color:var(--slate);margin-top:2px}
.stop-time{font-size:11px;color:var(--green-deep);font-weight:500;margin-top:3px}
.stop-tour{font-size:11px;color:var(--amber);font-weight:500;margin-top:2px}
.stop-cost{font-size:11px;color:var(--peat);margin-top:1px}
.stop-remove{background:none;border:none;color:var(--mist);cursor:pointer;font-size:16px;padding:2px;line-height:1;transition:color 0.15s}
.stop-remove:hover{color:#c0392b}
.drive-time-between{display:flex;align-items:center;gap:8px;padding:6px 0 6px 14px;color:var(--slate);font-size:11px}
.drive-line{flex:1;height:1px;background:var(--stone)}
.journey-summary{padding:16px 24px;border-top:1px solid var(--stone);background:var(--off-white)}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--slate);margin-bottom:6px}
.summary-total{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--dark);padding-top:8px;border-top:1px solid var(--stone)}
.cost-toggle{margin-top:8px;width:100%;padding:8px;background:none;border:1px dashed var(--mist);border-radius:var(--radius-sm);font-size:12px;color:var(--slate);cursor:pointer;transition:all 0.2s}
.cost-toggle:hover{border-color:var(--amber);color:var(--amber)}
.cost-breakdown{margin-top:10px;padding:12px;background:var(--amber-pale);border-radius:var(--radius-sm);border:1px solid var(--amber-light)}
.cost-row{display:flex;justify-content:space-between;font-size:12px;color:var(--peat);margin-bottom:5px}
.cost-total-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--amber);padding-top:6px;border-top:1px solid var(--amber-light);margin-top:4px}
.save-journey-btn{width:100%;margin-top:14px;padding:13px;background:var(--amber);color:white;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s}
.save-journey-btn:hover{background:#b0761f}
.signin-nudge{margin:12px 0 0;padding:12px 14px;background:var(--amber-pale);border-radius:var(--radius-sm);border:1px solid var(--amber-light);display:flex;align-items:flex-start;gap:10px}
.nudge-icon{font-size:16px;margin-top:1px}
.nudge-text{font-size:12px;color:var(--peat);line-height:1.5}
.nudge-text strong{color:var(--amber)}
.nudge-btn{display:inline-block;margin-top:6px;padding:6px 14px;background:white;border:1px solid var(--amber);border-radius:100px;font-size:11px;font-weight:500;color:var(--amber);cursor:pointer;transition:all 0.15s}
.nudge-btn:hover{background:var(--amber);color:white}

/* MAP AREA */
.map-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.map-toolbar{padding:10px 16px;background:white;border-bottom:1px solid var(--stone);display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:10}
.filter-btn{padding:6px 14px;border-radius:100px;border:1.5px solid var(--stone);background:white;color:var(--peat);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.filter-btn:hover{border-color:var(--green-mid);color:var(--green-deep)}
.filter-btn.active{background:var(--green-deep);color:white;border-color:var(--green-deep)}
.filter-btn.today-btn.active{background:var(--amber);border-color:var(--amber)}
.filter-sep{width:1px;height:20px;background:var(--stone);flex-shrink:0}
.map-hint{font-size:11px;color:var(--slate);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
#map{flex:1;z-index:1;min-height:400px}

/* ACCOMMODATION MODAL */
.accom-overlay{position:fixed;inset:0;background:rgba(28,26,24,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.accom-panel{background:white;border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:900px;max-height:80vh;overflow-y:auto;padding:28px;animation:slideUp 0.3s var(--ease-out)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.accom-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.accom-title{font-family:var(--font-display);font-size:26px;font-weight:400;color:var(--dark)}
.accom-close{background:none;border:none;font-size:22px;color:var(--slate);cursor:pointer;padding:4px}
.accom-tabs{display:flex;gap:8px;margin-bottom:20px}
.accom-tab{padding:8px 20px;border-radius:100px;border:1.5px solid var(--stone);background:white;font-size:13px;font-weight:500;color:var(--peat);cursor:pointer;transition:all 0.18s}
.accom-tab.active{background:var(--dark);color:white;border-color:var(--dark)}
.accom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.accom-card{background:var(--off-white);border:1px solid var(--stone);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.2s}
.accom-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft);border-color:var(--green-mid)}
.accom-img{width:100%;height:140px;object-fit:cover}
.accom-body{padding:14px}
.accom-name{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:3px}
.accom-type{font-size:11px;color:var(--slate);margin-bottom:6px}
.accom-meta{display:flex;align-items:center;justify-content:space-between}
.accom-stars{color:var(--amber);font-size:12px}
.accom-price{font-size:14px;font-weight:600;color:var(--green-deep)}
.accom-dist{font-size:11px;color:var(--slate);margin-top:4px}
.accom-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;background:var(--amber-pale);color:var(--amber);margin-top:6px}

/* PLACES MOCK */
.places-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.place-card{background:white;border:1px solid var(--stone);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all 0.2s}
.place-card:hover{border-color:var(--green-mid);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.place-rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--peat);margin:4px 0}
.place-rating .stars{color:var(--amber)}
.place-price-range{font-size:12px;color:var(--slate)}
.place-type{font-size:11px;color:var(--green-deep);font-weight:500}
.place-open{font-size:11px;margin-top:4px}
.place-open.open{color:#27ae60}
.place-open.closed{color:#e74c3c}

/* BELOW MAP — EDITORIAL SECTION */
.editorial-section{background:var(--off-white);padding:48px 32px;border-top:1px solid var(--stone)}
.editorial-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
.editorial-title{font-family:var(--font-display);font-size:clamp(26px,3vw,38px);font-weight:400;color:var(--dark)}
.editorial-title em{font-style:italic;color:var(--amber)}
.editorial-link{font-size:13px;color:var(--green-deep);text-decoration:none;font-weight:500}
.editorial-link:hover{text-decoration:underline}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:48px}
.featured-card{background:white;border-radius:var(--radius);overflow:hidden;border:1px solid var(--stone);cursor:pointer;transition:all 0.25s var(--ease-out)}
.featured-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:transparent}
.featured-img{width:100%;height:180px;object-fit:cover;display:block}
.featured-body{padding:18px}
.featured-tag{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--green-deep);margin-bottom:6px}
.featured-name{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--dark);margin-bottom:4px;line-height:1.2}
.featured-desc{font-size:13px;color:var(--slate);line-height:1.6;margin-bottom:12px}
.featured-meta{display:flex;align-items:center;justify-content:space-between}
.featured-region{font-size:11px;color:var(--mist)}
.featured-cta{font-size:12px;font-weight:600;color:var(--amber)}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.event-card{background:white;border:1px solid var(--stone);border-radius:var(--radius);padding:20px;display:flex;gap:16px;cursor:pointer;transition:all 0.2s}
.event-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.event-date-block{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;height:52px;background:var(--amber);border-radius:var(--radius-sm);color:white}
.event-day{font-size:20px;font-weight:700;line-height:1}
.event-month{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.event-info{flex:1}
.event-name{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:3px}
.event-venue{font-size:12px;color:var(--slate);margin-bottom:4px}
.event-price{font-size:12px;font-weight:500;color:var(--green-deep)}
.event-badge{display:inline-block;padding:2px 8px;border-radius:100px;background:var(--amber-pale);color:var(--amber);font-size:10px;font-weight:600;margin-left:6px}

/* DISTILLERY PAGE */
.distillery-page{height:100vh;overflow-y:auto;background:var(--off-white)}
.dist-back-bar{display:flex;align-items:center;gap:10px;padding:14px 24px;background:var(--dark);color:white;cursor:pointer;transition:background 0.2s;position:sticky;top:0;z-index:50}
.dist-back-bar:hover{background:var(--peat)}
.dist-back-bar span{font-size:13px;font-weight:500}
.dist-back-stops{font-size:11px;background:var(--amber);padding:2px 8px;border-radius:100px}
.distillery-hero{position:relative;height:55vh;min-height:360px;display:flex;align-items:flex-end;overflow:hidden}
.distillery-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.distillery-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,26,24,0.75) 0%,rgba(28,26,24,0.1) 60%)}
.distillery-hero-content{position:relative;z-index:2;padding:40px 48px;width:100%;display:flex;align-items:flex-end;justify-content:space-between}
.distillery-hero-title{font-family:var(--font-display);font-size:clamp(36px,5vw,64px);font-weight:300;color:white;line-height:1.05}
.distillery-hero-sub{font-size:14px;color:rgba(255,255,255,0.75);margin-top:6px;display:flex;align-items:center;gap:12px}
.hero-badge{padding:4px 12px;border-radius:100px;border:1px solid rgba(255,255,255,0.4);font-size:11px;color:rgba(255,255,255,0.85)}
.distillery-hero-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.hero-action-btn{padding:12px 24px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s;white-space:nowrap}
.hero-action-primary{background:var(--amber);color:white}
.hero-action-primary:hover{background:#b0761f}
.hero-action-secondary{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.4);color:white}
.hero-action-secondary:hover{background:rgba(255,255,255,0.25)}
.hero-action-secondary.in-journey{background:var(--green-deep);border-color:var(--green-deep)}

// ── JOURNEY MODE ──────────────────────────────────────────────────────────────
function JourneyMode({initialAnswer,onComplete}){
  const [step,setStep]=useState(1);
  const [answers,setAnswers]=useState({timeframe:initialAnswer.timeframe,mode:initialAnswer.mode,fast:false});

  const questions=[
    {id:'start',q:'Where will your journey start?',hint:"We'll centre your map here",
      options:['Port Ellen (Ferry Terminal)','Port Askaig (Ferry Terminal)','Bowmore (Town Centre)',"I'm already on Islay"]},
    {id:'duration',q:'How long will your adventure last?',hint:"We'll suggest the right number of distilleries",
      options:['Day trip','Weekend','3–5 days','One week or more']},
    {id:'interests',q:'What would make this the perfect whisky adventure?',hint:'Choose everything that excites you',multi:true,
      options:[
        {label:'Legendary Distilleries',icon:'🏆'},{label:'Hidden Gems',icon:'💎'},
        {label:'Warehouse Tastings',icon:'🪣'},{label:'Peated Whisky',icon:'💨'},
        {label:'Scenic Drives',icon:'🛣️'},{label:'Photography',icon:'📷'},
        {label:'Beaches',icon:'🏖️'},{label:'Walking & Hiking',icon:'🥾'},
        {label:'Cycling',icon:'🚴'},{label:'Historic Sites',icon:'🏛️'},
        {label:'Local Food',icon:'🍽️'},{label:'Luxury Stays',icon:'🛏️'},
        {label:'Dog Friendly',icon:'🐕'},{label:'Family Friendly',icon:'👨‍👩‍👧'},
      ]},
  ];

  const current=questions[step-1];
  const isMulti=current.multi;
  const selected=answers[current.id]||(isMulti?[]:null);

  function select(opt){
    if(isMulti){
      const l=typeof opt==='object'?opt.label:opt;
      const arr=selected.includes(l)?selected.filter(x=>x!==l):[...selected,l];
      setAnswers({...answers,[current.id]:arr});
    } else {
      setAnswers({...answers,[current.id]:opt});
    }
  }
  function canContinue(){return isMulti?selected.length>0:!!answers[current.id]}
  function next(){if(step<questions.length)setStep(step+1);else onComplete(answers);}

  return (
    <div className="journey-screen page">
      <nav className="journey-nav">
        <div className="journey-nav-logo"><Logo color="#3D6B47" size={28}/><span style={{fontFamily:'var(--font-display)',fontSize:'16px',color:'var(--dark)',marginLeft:'8px'}}>Scotland Whisky Trails</span></div>
        <div className="progress-dots">{[...Array(questions.length+1)].map((_,i)=><div key={i} className={'dot'+(i<step?' done':i===step?' active':'')}/>)}</div>
      </nav>
      <div className="journey-header">
        <div className="journey-eyebrow">Building your journey — step {step+1} of {questions.length+1}</div>
        <h2 className="journey-title">{current.q}</h2>
        {current.hint&&<p style={{fontSize:'14px',color:'var(--slate)',marginTop:'8px'}}>{current.hint}</p>}
      </div>
      <div className="q-cards">
        {current.options.map(opt=>{
          const label=typeof opt==='object'?opt.label:opt;
          const icon=typeof opt==='object'?opt.icon:null;
          const isSel=isMulti?selected.includes(label):answers[current.id]===label;
          return (
            <button key={label} className={'q-card'+(icon?' interest-card':'')+(isSel?' selected':'')} onClick={()=>select(opt)}>
              {icon&&<span className="card-icon">{icon}</span>}
              <span className={icon?'card-label':''}>{label}</span>
            </button>
          );
        })}
      </div>
      <button className="journey-next-btn" onClick={next} disabled={!canContinue()}>
        {step<questions.length?'Continue →':'Show me my journey →'}
      </button>
      {step>1&&<button className="journey-back" onClick={()=>setStep(step-1)}>← Back</button>}
    </div>
  );
}

// ── PLANNING WORKSPACE ────────────────────────────────────────────────────────
function PlanningWorkspace({journeyAnswers,onDistilleryClick}){
  const isFastMode=journeyAnswers?.fast===true;
  const mapRef=useRef(null);
  const leafletMap=useRef(null);
  const markersRef=useRef({});
  const attrMarkersRef=useRef([]);
  const [journey,setJourney]=useState([]);
  const [activeFilters,setActiveFilters]=useState(new Set(isFastMode?['open_today']:[]));
  const [showCost,setShowCost]=useState(false);
  const [showNudge,setShowNudge]=useState(false);
  const [showAccom,setShowAccom]=useState(false);
  const [showPlaces,setShowPlaces]=useState(false);

  const today=new Date();
  const dayName=today.toLocaleDateString('en-GB',{weekday:'long'});
  const isWeekday=today.getDay()>=1&&today.getDay()<=5;
  const isSat=today.getDay()===6;
  const isSun=today.getDay()===0;

  function isOpenToday(d){
    const h=d.hours.toLowerCase();
    if(h.includes('mon–sun')||h.includes('mon-sun'))return true;
    if(isSun&&h.includes('sun'))return true;
    if(isSat&&h.includes('sat'))return true;
    if(isWeekday&&(h.includes('mon–fri')||h.includes('mon-fri')||h.includes('mon–sat')||h.includes('mon-sat')))return true;
    return false;
  }

  const filterDefs=[
    ...(isFastMode?[{id:'open_today',label:`Open ${dayName}`,icon:'✅',cls:'today-btn'}]:[]),
    {id:'distillery',label:'Distilleries',icon:'🥃'},
    {id:'beach',label:'Beaches',icon:'🏖️'},
    {id:'walk',label:'Walks',icon:'🚶'},
    {id:'bike',label:'Cycling',icon:'🚴'},
    {id:'viewpoint',label:'Viewpoints',icon:'🌅'},
    {id:'attraction',label:'Attractions',icon:'🏛️'},
    {id:'food',label:'Cafés & Pubs',icon:'🍽️',action:'places'},
    {id:'accommodation',label:'Stays',icon:'🏨',action:'accom'},
  ];

  function toggleFilter(id,action){
    if(action==='accom'){setShowAccom(true);return;}
    if(action==='places'){setShowPlaces(true);return;}
    setActiveFilters(prev=>{
      const next=new Set(prev);
      if(next.has(id))next.delete(id);else next.add(id);
      return next;
    });
  }

  useEffect(()=>{
    if(leafletMap.current)return;
    // FIX #6: zoom out to show whole island (zoom 10)
    leafletMap.current=L.map(mapRef.current,{center:[55.77,-6.30],zoom:10,zoomControl:false});
    L.control.zoom({position:'bottomright'}).addTo(leafletMap.current);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
      attribution:'© OpenStreetMap © CartoDB',subdomains:'abcd',maxZoom:19
    }).addTo(leafletMap.current);

    DISTILLERIES.forEach(d=>{
      const el=document.createElement('div');
      el.className='distillery-marker';
      el.innerHTML='🥃';
      el.title=d.name;
      const icon=L.divIcon({html:el,className:'',iconSize:[36,36],iconAnchor:[18,18]});
      const marker=L.marker([d.lat,d.lng],{icon})
        .addTo(leafletMap.current)
        .bindPopup(buildPopup(d),{maxWidth:260,closeButton:false});
      marker.on('popupopen',()=>{
        setTimeout(()=>{
          const ab=document.getElementById(`add-${d.id}`);
          const vb=document.getElementById(`view-${d.id}`);
          if(ab)ab.onclick=()=>{addStop(d);marker.closePopup()};
          if(vb)vb.onclick=()=>onDistilleryClick(d);
        },50);
      });
      markersRef.current[d.id]={marker,el,d};
    });

    ATTRACTIONS.forEach(a=>{
      const el=document.createElement('div');
      el.className='attr-marker';
      el.innerHTML=a.icon;
      el.style.background=getCategoryColor(a.category);
      el.title=a.name;
      const icon=L.divIcon({html:el,className:'',iconSize:[28,28],iconAnchor:[14,14]});
      const m=L.marker([a.lat,a.lng],{icon})
        .bindPopup(`<div class="popup-inner"><div class="popup-tag">${a.type}</div><div class="popup-name">${a.name}</div><div class="popup-detail">${a.desc}</div></div>`,{maxWidth:220,closeButton:false});
      attrMarkersRef.current.push({marker:m,category:a.category});
    });
  },[]);

  function buildPopup(d){
    return `<div class="popup-inner">
      <div class="popup-tag">${d.style}</div>
      <div class="popup-name">${d.name}</div>
      <div class="popup-region">${d.region} · Est. ${d.founded}</div>
      <div class="popup-detail">${d.tagline}</div>
      <div class="popup-actions">
        <button class="popup-btn popup-btn-secondary" id="view-${d.id}">View →</button>
        <button class="popup-btn popup-btn-primary" id="add-${d.id}">+ Add</button>
      </div>
    </div>`;
  }

  function addStop(d,tour=null){
    setJourney(prev=>{
      if(prev.some(s=>s.id===d.id&&s.tourId===(tour?.name||null)))return prev;
      const next=[...prev,{...d,tourId:tour?.name||null,tourPrice:tour?.price||null,tourLabel:tour?.name||null}];
      const m=markersRef.current[d.id];
      if(m)m.el.classList.add('in-journey');
      if(next.length===3)setTimeout(()=>setShowNudge(true),600);
      return next;
    });
  }

  function removeStop(idx){
    setJourney(prev=>{
      const next=prev.filter((_,i)=>i!==idx);
      // Remove in-journey class only if no more stops from this distillery
      const removed=prev[idx];
      if(!next.some(s=>s.id===removed.id)){
        const m=markersRef.current[removed.id];
        if(m)m.el.classList.remove('in-journey');
      }
      if(next.length<3)setShowNudge(false);
      return next;
    });
  }

  // Apply filters to markers
  useEffect(()=>{
    // open_today: grey out closed distilleries
    DISTILLERIES.forEach(d=>{
      const m=markersRef.current[d.id];
      if(!m)return;
      if(activeFilters.has('open_today')){
        const open=isOpenToday(d);
        m.el.style.opacity=open?'1':'0.3';
        m.el.style.filter=open?'none':'grayscale(100%)';
      } else {
        m.el.style.opacity='1';
        m.el.style.filter='none';
      }
    });

    // attraction markers: show if category is in active filters, or no category filters active
    const catFilters=['beach','walk','bike','viewpoint','attraction','food','accommodation'];
    const activeCats=catFilters.filter(c=>activeFilters.has(c));

    attrMarkersRef.current.forEach(({marker,category})=>{
      const show=activeCats.length===0||activeCats.includes(category);
      if(show){if(!leafletMap.current.hasLayer(marker))marker.addTo(leafletMap.current);}
      else{if(leafletMap.current.hasLayer(marker))marker.remove();}
    });
  },[activeFilters]);

  const totalDrive=journey.length<2?0:journey.reduce((acc,s,i)=>i===0?0:acc+getDriveTime(journey[i-1].id,s.id),0);
  const totalVisit=journey.length*90;
  const totalCost=journey.reduce((acc,s)=>acc+(s.tourPrice||0),0);
  const tourCostCount=journey.filter(s=>s.tourPrice).length;

  const journeyName=journey.length===0?'Your Journey':
    journey.length<=2?'My Islay Journey':
    journey.some(s=>['ardbeg','lagavulin','laphroaig'].includes(s.id))?'The Southern Shore Pilgrimage':
    journey.some(s=>['caol_ila','bunnahabhain','ardnahoe'].includes(s.id))?'The Northern Coast Discovery':
    'My Islay Whisky Journey';

  return (
    <div className="workspace-root">
      <div className="workspace-main">
        {/* Journey panel */}
        <div className="journey-panel">
          <div className="panel-header">
            <div className="panel-eyebrow">My Whisky Journey</div>
            <div className="panel-title">{journeyName}</div>
            <div className="panel-subtitle">{journey.length===0?'Tap a distillery on the map to begin':`${journey.length} stop${journey.length>1?'s':''} added`}</div>
          </div>
          <div className="journey-stops">
            {journey.length===0&&(
              <div className="journey-empty">
                <div className="journey-empty-icon">🥃</div>
                <p>Your distilleries will appear here as you add them from the map.</p>
              </div>
            )}
            {journey.map((stop,i)=>(
              <React.Fragment key={stop.id+'-'+i}>
                {i>0&&(
                  <div className="drive-time-between">
                    <span>🚗</span>
                    <span>{formatTime(getDriveTime(journey[i-1].id,stop.id))} drive</span>
                    <div className="drive-line"/>
                  </div>
                )}
                <div className="journey-stop">
                  <div className="stop-number">{i+1}</div>
                  <div className="stop-info">
                    <div className="stop-name">{stop.name}</div>
                    <div className="stop-region">{stop.region} · {stop.style}</div>
                    <div className="stop-time">~{stop.avg_visit} visit</div>
                    {stop.tourLabel&&<div className="stop-tour">🎟 {stop.tourLabel}</div>}
                    {stop.tourPrice&&<div className="stop-cost">£{stop.tourPrice} per person</div>}
                  </div>
                  <button className="stop-remove" onClick={()=>removeStop(i)}>×</button>
                </div>
              </React.Fragment>
            ))}
            {showNudge&&(
              <div className="signin-nudge">
                <span className="nudge-icon">💾</span>
                <div className="nudge-text">
                  <strong>Save your journey across devices?</strong><br/>
                  Sign in to pick up where you left off — on any device, any time.
                  <br/><button className="nudge-btn">Continue with Google</button>
                </div>
              </div>
            )}
          </div>
          {journey.length>0&&(
            <div className="journey-summary">
              <div className="summary-row"><span>Driving time</span><span>{formatTime(totalDrive)}</span></div>
              <div className="summary-row"><span>Estimated visits</span><span>{formatTime(totalVisit)}</span></div>
              <div className="summary-total"><span>Total journey</span><span>{formatTime(totalDrive+totalVisit)}</span></div>
              <button className="cost-toggle" onClick={()=>setShowCost(!showCost)}>
                {showCost?'▲ Hide':'▼ Show'} estimated tour costs {tourCostCount>0?`(${tourCostCount} tour${tourCostCount>1?'s':''} booked)':''}
              </button>
              {showCost&&(
                <div className="cost-breakdown">
                  {journey.map((s,i)=>(
                    <div className="cost-row" key={i}>
                      <span>{s.name}{s.tourLabel?' - '+s.tourLabel:' - No tour selected'}</span>
                      <span>{s.tourPrice?'£'+s.tourPrice:'-'}</span>
                    </div>
                  ))}
                  {totalCost>0&&<div className="cost-total-row"><span>Tours total</span><span>£{totalCost} pp</span></div>}
                  <p style={{fontSize:'11px',color:'var(--slate)',marginTop:'8px'}}>Accommodation and transport not included. Add tours from each distillery page.</p>
                </div>
              )}
              <button className="save-journey-btn">📋 Save My Journey</button>
              <button style={{width:'100%',marginTop:'8px',padding:'11px',background:'white',color:'var(--green-deep)',border:'1px solid var(--green-mid)',borderRadius:'var(--radius-sm)',fontSize:'13px',fontWeight:'500',cursor:'pointer'}}
                onClick={()=>setShowAccom(true)}>🏨 Find somewhere to stay</button>
            </div>
          )}
        </div>

        {/* Map */}
        <div className="map-area">
          <div className="map-toolbar">
            {filterDefs.map((f,i)=>(
              <React.Fragment key={f.id}>
                {i===1&&isFastMode&&<div className="filter-sep"/>}
                <button
                  className={'filter-btn'+(f.cls?' '+f.cls:'')+(activeFilters.has(f.id)?' active':'')}
                  onClick={()=>toggleFilter(f.id,f.action)}
                >
                  {f.icon} {f.label}
                </button>
              </React.Fragment>
            ))}
            <div className="filter-sep"/>
            <span className="map-hint">
              {activeFilters.has('open_today')?`✅ Greyed = closed ${dayName}`:'🥃 Tap distillery to add'}
            </span>
          </div>
          <div id="map" ref={mapRef}/>
        </div>
      </div>

      {/* EDITORIAL SECTION — scrollable below map */}
      <div className="workspace-scroll">
        <div className="editorial-section">
          <div className="editorial-header">
            <h2 className="editorial-title">Featured <em>distilleries</em></h2>
            <a href="#" className="editorial-link">View all →</a>
          </div>
          <div className="featured-grid">
            {FEATURED_DISTILLERIES.map(f=>{
              const d=DISTILLERIES.find(x=>x.id===f.id);
              return (
                <div className="featured-card" key={f.id} onClick={()=>onDistilleryClick(d)}>
                  <img className="featured-img" src={d.image} alt={d.name}/>
                  <div className="featured-body">
                    <div className="featured-tag">{f.tag}</div>
                    <div className="featured-name">{d.name}</div>
                    <div className="featured-desc">{f.desc}</div>
                    <div className="featured-meta">
                      <span className="featured-region">{d.region} · Est. {d.founded}</span>
                      <span className="featured-cta">Explore →</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="editorial-header">
            <h2 className="editorial-title">Islay <em>events & experiences</em></h2>
            <a href="#" className="editorial-link">View all →</a>
          </div>
          <div className="events-grid">
            {EVENTS.map((e,i)=>(
              <div className="event-card" key={i}>
                <div className="event-date-block"><div className="event-day">{e.day}</div><div className="event-month">{e.month}</div></div>
                <div className="event-info">
                  <div className="event-name">{e.name}{e.badge&&<span className="event-badge">{e.badge}</span>}</div>
                  <div className="event-venue">{e.venue}</div>
                  <div className="event-price">{e.price} per person</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {showAccom&&<AccomModal onClose={()=>setShowAccom(false)}/>}
      {showPlaces&&<PlacesModal onClose={()=>setShowPlaces(false)}/>}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState('home');
  const [journeyAnswers,setJourneyAnswers]=useState(null);
  const [selectedDistillery,setSelectedDistillery]=useState(null);
  const [selectedPost,setSelectedPost]=useState(null);
  const [journeyStops,setJourneyStops]=useState(()=>{
    try{const s=localStorage.getItem('swt_journey');return s?JSON.parse(s):[];}catch{return[];}
  });

  useEffect(()=>{
    try{localStorage.setItem('swt_journey',JSON.stringify(journeyStops));}catch{}
  },[journeyStops]);

  function handleHomeBegin(answers){
    setJourneyAnswers(answers);
    setScreen(answers.fast?'workspace':'journey');
  }
  function handleJourneyComplete(answers){setJourneyAnswers(answers);setScreen('workspace');}
  function handleDistilleryClick(d){setSelectedDistillery(d);setScreen('distillery');}
  function handleAddStop(d,tour){
    setJourneyStops(prev=>{
      if(prev.some(s=>s.id===d.id&&(s.tourId||'')===(tour?.name||'')))return prev;
      return [...prev,{...d,tourId:tour?.name||null,tourPrice:tour?.price||null,tourLabel:tour?.name||null}];
    });
  }

  return (
    <>
      {screen==='home'&&<HomePage onBegin={handleHomeBegin} onBlog={()=>setScreen('blog')}/>}
      {screen==='journey'&&<JourneyMode initialAnswer={journeyAnswers} onComplete={handleJourneyComplete}/>}
      {screen==='workspace'&&(
        <div style={{height:'100vh',overflowY:'auto',display:'flex',flexDirection:'column'}}>
          <PlanningWorkspace journeyAnswers={journeyAnswers} onDistilleryClick={handleDistilleryClick} onAddStop={handleAddStop}/>
          <SiteFooter onBlog={()=>setScreen('blog')} onHome={()=>setScreen('home')}/>
        </div>
      )}
      {screen==='distillery'&&selectedDistillery&&(
        <DistilleryPage
          distillery={selectedDistillery}
          journey={journeyStops}
          onBack={()=>setScreen('workspace')}
          onAddStop={handleAddStop}
        />
      )}
      {screen==='blog'&&(
        <BlogPage
          onBack={()=>setScreen('home')}
          onPost={p=>{setSelectedPost(p);setScreen('post');}}
          onHome={()=>setScreen('home')}
        />
      )}
      {screen==='post'&&selectedPost&&(
        <BlogPostPage
          post={selectedPost}
          onBack={()=>setScreen('blog')}
          onHome={()=>setScreen('home')}
        />
      )}
    </>
  );
}

        <div className="blog-nav-logo" onClick={onHome}>
          <Logo color="#3D6B47" size={28}/>
          <span className="blog-nav-logo-text">Scotland Whisky Trails</span>
        </div>
        <div className="blog-nav-links">
          <a href="#" onClick={e=>{e.preventDefault();onHome();}}>Plan a Journey</a>
          <a href="#" onClick={e=>{e.preventDefault();onBack();}} className="active">Journal</a>
          <a href="#">About</a>
        </div>
      </nav>
      <div className="post-hero">
        <img className="post-hero-img" src={post.image} alt={post.title}/>
        <div className="post-hero-overlay"/>
        <div className="post-hero-content">
          <button className="post-back" onClick={onBack}>← Back to Journal</button>
          <div className="post-cat-hero">{post.catLabel}</div>
          <h1 className="post-title">{post.title}</h1>
        </div>
      </div>
      <div className="post-body">
        <div className="post-meta-bar">
          <img className="post-author-img" src={post.authorImg} alt={post.author}/>
          <span className="post-author-name">{post.author}</span>
          <span>·</span>
          <span>{post.date}</span>
          <span>·</span>
          <span>{post.readTime}</span>
        </div>
        <div className="post-content">
          {post.content.map((block,i)=>{
            if(block.type==='p')return <p key={i}>{block.text}</p>;
            if(block.type==='h2')return <h2 key={i}>{block.text}</h2>;
            if(block.type==='blockquote')return <blockquote key={i}><p>{block.text}</p></blockquote>;
            return null;
          })}
        </div>
        <div className="post-tags">
          {post.tags.map(t=><span className="post-tag" key={t}>{t}</span>)}
        </div>
      </div>
      {related.length>0&&(
        <div className="post-related">
          <div style={{maxWidth:'1100px',margin:'0 auto',padding:'0 48px'}}>
            <div className="post-related-title">More from the Journal</div>
            <div className="post-related-grid">
              {related.map(p=>(
                <div className="post-related-card" key={p.id} onClick={()=>{}}>
                  <img className="post-related-img" src={p.image} alt={p.title}/>
                  <div className="post-related-body">
                    <div className="post-related-name">{p.title}</div>
                    <div className="post-related-meta">{p.author} · {p.date}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      <SiteFooter onBlog={onBack} onHome={onHome}/>
    </div>
  );
}


</script>
</body>
</html>
