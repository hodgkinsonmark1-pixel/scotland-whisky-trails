<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DramStory — Where Whisky Adventures Begin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥃</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#FFFFFF;--off-white:#F5F1E8;--stone:#E8E2D6;--mist:#D4C9B8;
  --slate:#8A8274;--peat:#4A4438;--dark:#1A3A4A;
  --green-light:#EAE6DC;--green-mid:#B87D4B;--green-deep:#1A3A4A;
  --amber:#D4A574;--amber-light:#E8C99A;--amber-pale:#FBF5EA;
  --navy:#1A3A4A;--navy-mid:#2A5A72;--copper:#B87D4B;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Inter',system-ui,sans-serif;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --shadow-soft:0 4px 24px rgba(26,58,74,0.10);
  --shadow-card:0 2px 12px rgba(26,58,74,0.10);
  --radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;font-family:var(--font-body);background:var(--off-white);color:var(--dark);overflow-x:hidden}
#root{min-height:100%;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--mist);border-radius:3px}

/* HERO */
.hero{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(28,26,24,0.2) 0%,rgba(28,26,24,0.45) 50%,rgba(28,26,24,0.65) 100%)}
.hero-nav{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:80px;background:transparent}
.hero-nav-links{display:flex;gap:32px}
.hero-nav-links a{font-family:var(--font-body);font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.85);text-decoration:none;transition:color 0.2s}
.hero-nav-links a:hover{color:white}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.hero-tagline{font-family:var(--font-display);font-size:clamp(42px,6vw,80px);font-weight:300;color:white;line-height:1.1;letter-spacing:-0.01em;opacity:0;transition:opacity 1.2s var(--ease-out),transform 1.2s var(--ease-out);transform:translateY(12px)}
.hero-tagline.visible{opacity:1;transform:translateY(0)}
.hero-tagline em{font-style:italic;font-weight:300;color:var(--amber-light)}
.hero-question{font-family:var(--font-display);font-size:clamp(22px,3vw,36px);font-weight:300;color:rgba(255,255,255,0.92);margin-top:48px;letter-spacing:0.01em;opacity:0;transition:opacity 1.0s var(--ease-out),transform 1.0s var(--ease-out);transform:translateY(8px)}
.hero-question.visible{opacity:1;transform:translateY(0)}
.hero-options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px;opacity:0;transition:opacity 0.8s var(--ease-out)}
.hero-options.visible{opacity:1}
.hero-option{padding:12px 24px;border-radius:100px;border:1px solid rgba(255,255,255,0.45);background:rgba(255,255,255,0.10);backdrop-filter:blur(8px);color:white;font-family:var(--font-body);font-size:14px;font-weight:400;cursor:pointer;transition:all 0.2s;letter-spacing:0.01em}
.hero-option:hover{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.7);transform:translateY(-1px)}
.hero-option.selected{background:var(--amber);border-color:var(--amber);color:white}
.scroll-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity 0.8s;pointer-events:none}
.scroll-hint.visible{opacity:1}
.scroll-hint.hidden{opacity:0}
.chevron-anim{width:20px;height:20px;border-right:1.5px solid rgba(255,255,255,0.6);border-bottom:1.5px solid rgba(255,255,255,0.6);transform:rotate(45deg);animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0);opacity:0.5}50%{transform:rotate(45deg) translateY(4px);opacity:1}}

/* JOURNEY MODE */
.journey-screen{min-height:100vh;background:var(--off-white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px 48px;position:relative;overflow:hidden}
.journey-screen-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.57;z-index:0;transition:background-image 0.4s ease}
.journey-screen-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(248,247,244,0.55) 0%,rgba(248,247,244,0.88) 55%,var(--off-white) 100%)}
.journey-nav,.journey-header,.progress-dots,.q-cards,.journey-next-btn,.journey-back{position:relative;z-index:1}
.journey-header{text-align:center;margin-bottom:56px}
.journey-eyebrow{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:16px}
.journey-title{font-family:var(--font-display);font-size:clamp(32px,4vw,52px);font-weight:300;color:var(--dark);line-height:1.15;letter-spacing:-0.01em}
.journey-title em{font-style:italic;color:var(--amber)}
.progress-dots{display:flex;gap:10px;justify-content:center;margin-bottom:48px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mist);transition:all 0.3s var(--ease-out)}
.dot.active{background:var(--green-deep);transform:scale(1.2)}
.dot.done{background:var(--green-mid)}
.q-cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:720px;width:100%}
.q-card{padding:16px 28px;border-radius:var(--radius);border:1.5px solid var(--stone);background:white;font-family:var(--font-body);font-size:15px;font-weight:400;color:var(--peat);cursor:pointer;transition:all 0.2s var(--ease-out);box-shadow:var(--shadow-card)}
.q-card:hover{border-color:var(--green-mid);color:var(--green-deep);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.q-card.selected{border-color:var(--green-deep);background:var(--green-light);color:var(--green-deep);font-weight:500}
.q-card.interest-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 20px;min-width:120px;text-align:center}
.q-card.interest-card .card-icon{font-size:24px}
.q-card.interest-card .card-label{font-size:13px}
.journey-next-btn{margin-top:40px;padding:16px 48px;background:var(--green-deep);color:white;border:none;border-radius:100px;font-family:var(--font-body);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.2s;letter-spacing:0.02em}
.journey-next-btn:hover{background:var(--peat);transform:translateY(-1px);box-shadow:0 6px 20px rgba(61,107,71,0.3)}
.journey-next-btn:disabled{opacity:0.4;cursor:default;transform:none}
.journey-back{margin-top:20px;background:none;border:none;color:var(--slate);font-size:13px;cursor:pointer;font-family:var(--font-body);letter-spacing:0.04em;text-decoration:underline;text-underline-offset:3px}
.journey-nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 48px;height:64px;display:flex;align-items:center;justify-content:space-between;background:var(--off-white);border-bottom:1px solid var(--stone)}
.journey-nav-logo{font-family:var(--font-display);font-size:16px;font-weight:500;color:var(--dark);display:flex;align-items:center;gap:8px}
.journey-nav-logo span{display:none}

/* WORKSPACE */
.workspace-root{display:flex;flex-direction:column;height:calc(100vh - 64px);overflow:hidden;flex-shrink:0}
.map-page-header{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--off-white);border-bottom:1px solid var(--stone);z-index:30}
.map-page-header-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.map-page-header-logo-text{display:none}
.map-page-header-links{display:flex;align-items:center;gap:24px}
.map-page-header-links a{font-size:13px;font-weight:500;letter-spacing:0.03em;color:var(--peat);text-decoration:none;transition:color 0.2s;cursor:pointer}
.map-page-header-links a:hover{color:var(--dark)}
.map-page-header-badge{font-size:11px;background:var(--green-light);color:var(--green-deep);padding:4px 10px;border-radius:100px;font-weight:600}
.map-page-header-burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;background:none;border:none;cursor:pointer;padding:0}
.map-page-header-burger span{display:block;width:22px;height:2px;background:var(--peat);border-radius:2px;transition:all 0.2s}
.map-page-mobile-menu{display:none}
.workspace-main{display:flex;flex:1;min-height:0;overflow:hidden}
.workspace-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* BACK TO MAP BAR */
.back-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--dark);color:white;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.back-bar:hover{background:var(--peat)}
.back-bar-text{font-size:13px;font-weight:500;letter-spacing:0.02em}
.back-bar-stops{font-size:11px;background:var(--amber);padding:2px 8px;border-radius:100px;margin-left:4px}

/* LEFT PANEL */
.journey-panel{width:320px;min-width:320px;background:white;border-right:1px solid var(--stone);display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(28,26,24,0.06);z-index:20;overflow:hidden}
.panel-header{padding:24px 24px 16px;border-bottom:1px solid var(--stone);background:white}
.panel-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-deep);margin-bottom:6px}
.panel-title{font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--dark);line-height:1.2}
.panel-subtitle{font-size:12px;color:var(--slate);margin-top:4px}
.journey-stops{flex:1;overflow-y:auto;padding:16px}
.journey-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--slate);text-align:center;gap:12px}
.journey-empty-icon{font-size:36px;opacity:0.4}
.journey-empty p{font-size:13px;line-height:1.6;max-width:200px}
.journey-stop{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--stone);animation:slideIn 0.3s var(--ease-out)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.stop-number{width:28px;height:28px;border-radius:50%;background:var(--green-deep);color:white;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:14px;font-weight:500;color:var(--dark)}
.stop-region{font-size:11px;color:var(--slate);margin-top:2px}
.stop-time{font-size:11px;color:var(--green-deep);font-weight:500;margin-top:3px}
.stop-tour{font-size:11px;color:var(--amber);font-weight:500;margin-top:2px}
.stop-cost{font-size:11px;color:var(--peat);margin-top:1px}
.stop-remove{background:none;border:none;color:var(--mist);cursor:pointer;font-size:16px;padding:2px;line-height:1;transition:color 0.15s}
.stop-remove:hover{color:#c0392b}
.drive-time-between{display:flex;align-items:center;gap:8px;padding:6px 0 6px 14px;color:var(--slate);font-size:11px}
.drive-line{flex:1;height:1px;background:var(--stone)}
.journey-summary{padding:16px 24px;border-top:1px solid var(--stone);background:var(--off-white)}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--slate);margin-bottom:6px}
.summary-total{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:var(--dark);padding-top:8px;border-top:1px solid var(--stone)}
.cost-toggle{margin-top:8px;width:100%;padding:8px;background:none;border:1px dashed var(--mist);border-radius:var(--radius-sm);font-size:12px;color:var(--slate);cursor:pointer;transition:all 0.2s}
.cost-toggle:hover{border-color:var(--amber);color:var(--amber)}
.cost-breakdown{margin-top:10px;padding:12px;background:var(--amber-pale);border-radius:var(--radius-sm);border:1px solid var(--amber-light)}
.cost-row{display:flex;justify-content:space-between;font-size:12px;color:var(--peat);margin-bottom:5px}
.cost-total-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--amber);padding-top:6px;border-top:1px solid var(--amber-light);margin-top:4px}
.save-journey-btn{width:100%;margin-top:14px;padding:13px;background:var(--amber);color:white;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s}
.save-journey-btn:hover{background:#b0761f}
.signin-nudge{margin:12px 0 0;padding:12px 14px;background:var(--amber-pale);border-radius:var(--radius-sm);border:1px solid var(--amber-light);display:flex;align-items:flex-start;gap:10px}
.nudge-icon{font-size:16px;margin-top:1px}
.nudge-text{font-size:12px;color:var(--peat);line-height:1.5}
.nudge-text strong{color:var(--amber)}
.nudge-btn{display:inline-block;margin-top:6px;padding:6px 14px;background:white;border:1px solid var(--amber);border-radius:100px;font-size:11px;font-weight:500;color:var(--amber);cursor:pointer;transition:all 0.15s}
.nudge-btn:hover{background:var(--amber);color:white}

/* MAP AREA */
.map-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
.map-toolbar{padding:10px 16px;background:white;border-bottom:1px solid var(--stone);display:flex;align-items:center;gap:8px;flex-wrap:wrap;z-index:10}
.filter-btn{padding:6px 14px;border-radius:100px;border:1.5px solid var(--stone);background:white;color:var(--peat);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.filter-btn:hover{border-color:var(--green-mid);color:var(--green-deep)}
.filter-btn.active{background:var(--green-deep);color:white;border-color:var(--green-deep)}
.filter-btn.today-btn.active{background:var(--amber);border-color:var(--amber)}
.filter-sep{width:1px;height:20px;background:var(--stone);flex-shrink:0}
.map-hint{font-size:11px;color:var(--slate);margin-left:auto;display:flex;align-items:center;gap:6px;white-space:nowrap}
#map{flex:1;z-index:1;min-height:0;height:100%}

/* ACCOMMODATION MODAL */
.accom-overlay{position:fixed;inset:0;background:rgba(28,26,24,0.5);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s;padding:32px 16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.accom-panel{background:white;border-radius:var(--radius);width:100%;max-width:900px;max-height:calc(100vh - 64px);overflow-y:auto;padding:28px;animation:slideUp 0.3s var(--ease-out)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.accom-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.accom-title{font-family:var(--font-display);font-size:26px;font-weight:400;color:var(--dark)}
.accom-close{background:none;border:none;font-size:22px;color:var(--slate);cursor:pointer;padding:4px}
.accom-tabs{display:flex;gap:8px;margin-bottom:20px}
.accom-tab{padding:8px 20px;border-radius:100px;border:1.5px solid var(--stone);background:white;font-size:13px;font-weight:500;color:var(--peat);cursor:pointer;transition:all 0.18s}
.accom-tab.active{background:var(--dark);color:white;border-color:var(--dark)}
.accom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.accom-card{background:var(--off-white);border:1px solid var(--stone);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.2s}
.accom-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-soft);border-color:var(--green-mid)}
.accom-img{width:100%;height:140px;object-fit:cover}
.accom-body{padding:14px}
.accom-name{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:3px}
.accom-type{font-size:11px;color:var(--slate);margin-bottom:6px}
.accom-meta{display:flex;align-items:center;justify-content:space-between}
.accom-stars{color:var(--amber);font-size:12px}
.accom-price{font-size:14px;font-weight:600;color:var(--green-deep)}
.accom-dist{font-size:11px;color:var(--slate);margin-top:4px}
.accom-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;background:var(--amber-pale);color:var(--amber);margin-top:6px}

/* PLACES MOCK */
.places-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.place-card{background:white;border:1px solid var(--stone);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all 0.2s}
.place-card:hover{border-color:var(--green-mid);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.place-rating{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--peat);margin:4px 0}
.place-rating .stars{color:var(--amber)}
.place-price-range{font-size:12px;color:var(--slate)}
.place-type{font-size:11px;color:var(--green-deep);font-weight:500}
.place-open{font-size:11px;margin-top:4px}
.place-open.open{color:#27ae60}
.place-open.closed{color:#e74c3c}

/* BELOW MAP — EDITORIAL SECTION */
.editorial-section{background:var(--off-white);padding:48px 32px;border-top:1px solid var(--stone)}
.editorial-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
.editorial-title{font-family:var(--font-display);font-size:clamp(26px,3vw,38px);font-weight:400;color:var(--dark)}
.editorial-title em{font-style:italic;color:var(--amber)}
.editorial-link{font-size:13px;color:var(--green-deep);text-decoration:none;font-weight:500}
.editorial-link:hover{text-decoration:underline}
.featured-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:48px}
.featured-card{background:white;border-radius:var(--radius);overflow:hidden;border:1px solid var(--stone);cursor:pointer;transition:all 0.25s var(--ease-out)}
.featured-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:transparent}
.featured-img{width:100%;height:180px;object-fit:cover;display:block}
.featured-body{padding:18px}
.featured-tag{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--green-deep);margin-bottom:6px}
.featured-name{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--dark);margin-bottom:4px;line-height:1.2}
.featured-desc{font-size:13px;color:var(--slate);line-height:1.6;margin-bottom:12px}
.featured-meta{display:flex;align-items:center;justify-content:space-between}
.featured-region{font-size:11px;color:var(--mist)}
.featured-cta{font-size:12px;font-weight:600;color:var(--amber)}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.event-card{background:white;border:1px solid var(--stone);border-radius:var(--radius);padding:20px;display:flex;gap:16px;cursor:pointer;transition:all 0.2s}
.event-card:hover{border-color:var(--amber);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.event-date-block{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;height:52px;background:var(--amber);border-radius:var(--radius-sm);color:white}
.event-day{font-size:20px;font-weight:700;line-height:1}
.event-month{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase}
.event-info{flex:1}
.event-name{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:3px}
.event-venue{font-size:12px;color:var(--slate);margin-bottom:4px}
.event-price{font-size:12px;font-weight:500;color:var(--green-deep)}
.event-badge{display:inline-block;padding:2px 8px;border-radius:100px;background:var(--amber-pale);color:var(--amber);font-size:10px;font-weight:600;margin-left:6px}

/* DISTILLERY PAGE */
.distillery-page{height:100vh;overflow-y:auto;background:var(--off-white)}

  cat: 'review',
  catLabel: 'Whisky Review',
  title: 'Ardbeg Committee Reserve: Worth the Wait?',
  excerpt: 'The Committee Release is one of the most anticipated bottles in the Ardbeg calendar. We spent a morning in the Old Kiln Cafe working through three vintages. Here is our verdict.',
  date: '12 May 2025',
  author: 'Fiona MacAllister',
  readTime: '6 min read',
  image: 'https://images.unsplash.com/photo-1542741081-bc7afc3480fe?w=800&q=75',

  featured: true,
  content: [{
    type: 'p',
    text: "There are few whisky releases that generate genuine anticipation in the way the Ardbeg Committee Reserve does. Each year, a small allocation is set aside exclusively for members of the Ardbeg Committee — the distillery's global fan club — before any wider release. We were fortunate enough to taste three consecutive vintages side by side on a grey May morning in the Old Kiln Cafe."
  }, {
    type: 'h2',
    text: 'The Nose'
  }, {
    type: 'p',
    text: "The 2023 release opens with the expected Ardbeg peat smoke, but what strikes you first is the restraint. There is a medicinal quality — iodine and TCP — but softened by a wave of vanilla and green apple that gives the whole thing an unexpected lightness. The smoke here is coastal rather than industrial; think driftwood rather than bonfire."
  }, {
    type: 'blockquote',
    text: "This is Ardbeg at its most eloquent. The peat whispers rather than shouts, and what it has to say is worth hearing."
  }, {
    type: 'h2',
    text: 'The Palate'
  }, {
    type: 'p',
    text: "On the palate, the delivery is immediate and confident. Dark chocolate arrives first, then a surge of espresso and smoked sea salt. The mid-palate opens up into something almost tropical — mango, perhaps, or overripe pineapple — before the peat reasserts itself on the long, warming finish. Water is unnecessary. It would be a kindness to leave it alone."
  }, {
    type: 'p',
    text: "At cask strength, this is an assertive dram. But there is a generosity to it that rewards patience. Leave it in the glass for twenty minutes and it will show you something new each time you return to it."
  }, {
    type: 'h2',
    text: 'The Verdict'
  }, {
    type: 'p',
    text: "The Committee Reserve justifies its status. It is not simply a marketing exercise dressed up in limited-edition clothing — it is a genuinely different expression that shows what Ardbeg is capable of when the distillery holds a little back. If you have the chance to visit and join the Committee, do it. The annual release alone is worth the membership fee."
  }],
  tags: ['Ardbeg', 'Whisky Review', 'Islay', 'Heavily Peated', 'Committee Release']

  catLabel: 'Travel Story',
  title: 'Islay in Three Days: The Perfect Itinerary',
  excerpt: 'Three days is enough to see the soul of Islay — if you plan it right. We drove every road, visited all nine distilleries, and ate far too well. Here is what we learned.',
  date: '3 Apr 2025',
  author: 'James Thornton',
  readTime: '9 min read',
  image: 'https://images.unsplash.com/photo-1547321430-87fec39c6952?w=800&q=75',
  authorImg: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=70',
  featured: false,
  content: [{
    type: 'p',
    text: "Islay rewards those who give it time. The island is small enough to cross in forty minutes, yet somehow it manages to feel inexhaustible. Each road leads somewhere unexpected. Each distillery has a personality entirely its own. Three days is the minimum to do it justice."
  }, {
    type: 'h2',
    text: 'Day One: The South Shore'
  }, {
    type: 'p',
    text: "Begin at Port Ellen and work your way east. Laphroaig, Lagavulin and Ardbeg sit within three miles of each other on the southern coast — collectively known, with some reverence, as the Holy Trinity of Islay whisky. Book morning tours at all three if you can. By the afternoon, you will need the Old Kiln Cafe at Ardbeg and somewhere quiet to sit."
  }, {
    type: 'blockquote',
    text: "Lagavulin Bay at dusk, with the ruins of Dunyvaig Castle in the middle distance, is one of the finest sights in Scottish whisky."
  }, {
    type: 'h2',
    text: 'Day Two: The Heart of the Island'

    type: 'p',
    text: "Bowmore in the morning, Bruichladdich after lunch. The round church beside Bowmore distillery is worth twenty minutes of your time — the story behind its circular design (no corners for the devil to hide in) is one of the better pieces of island folklore. Bruichladdich, by contrast, is all progressive intent and Victorian ironwork. The contrast between the two distilleries is a useful metaphor for Islay itself."
