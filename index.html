<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Scotland Whisky Trails</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #FFFFFF;
    --off-white: #F8F7F4;
    --stone: #EAE6DF;
    --mist: #D4CFC6;
    --slate: #8A8680;
    --peat: #4A4640;
    --dark: #1C1A18;
    --green-light: #E8EDE6;
    --green-mid: #7A9B76;
    --green-deep: #3D6B47;
    --amber: #C4862A;
    --amber-light: #E8C97A;
    --amber-pale: #FBF3E2;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-soft: 0 4px 24px rgba(28,26,24,0.08);
    --shadow-card: 0 2px 12px rgba(28,26,24,0.10);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; font-family: var(--font-body); background: var(--off-white); color: var(--dark); overflow-x: hidden; }
  #root { height: 100%; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 3px; }

  /* ── HOMEPAGE ── */
  .hero {
    position: relative; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hero-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  .hero-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(to bottom,
      rgba(28,26,24,0.15) 0%,
      rgba(28,26,24,0.35) 50%,
      rgba(28,26,24,0.55) 100%);
  }
  .hero-nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 48px;
  }
  .hero-nav-links { display: flex; gap: 32px; }
  .hero-nav-links a {
    font-family: var(--font-body); font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.85); text-decoration: none;
    transition: color 0.2s;
  }
  .hero-nav-links a:hover { color: white; }

  .hero-content {
    position: relative; z-index: 2;
    text-align: center; padding: 0 24px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .hero-tagline {
    font-family: var(--font-display); font-size: clamp(42px, 6vw, 80px);
    font-weight: 300; color: white; line-height: 1.1;
    letter-spacing: -0.01em;
    opacity: 0; transition: opacity 1.2s var(--ease-out), transform 1.2s var(--ease-out);
    transform: translateY(12px);
  }
  .hero-tagline.visible { opacity: 1; transform: translateY(0); }
  .hero-tagline em { font-style: italic; font-weight: 300; color: var(--amber-light); }

  .hero-question {
    font-family: var(--font-display); font-size: clamp(22px, 3vw, 36px);
    font-weight: 300; color: rgba(255,255,255,0.92); margin-top: 48px;
    letter-spacing: 0.01em;
    opacity: 0; transition: opacity 1.0s var(--ease-out), transform 1.0s var(--ease-out);
    transform: translateY(8px);
  }
  .hero-question.visible { opacity: 1; transform: translateY(0); }

  .hero-options {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    margin-top: 28px;
    opacity: 0; transition: opacity 0.8s var(--ease-out);
  }
  .hero-options.visible { opacity: 1; }

  .hero-option {
    padding: 12px 24px; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(8px);
    color: white; font-family: var(--font-body); font-size: 14px; font-weight: 400;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.01em;
  }
  .hero-option:hover {
    background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.7);
    transform: translateY(-1px);
  }
  .hero-option.selected {
    background: var(--amber); border-color: var(--amber); color: white;
  }

  /* Scroll chevron */
  .scroll-hint {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: 0; transition: opacity 0.8s;
    pointer-events: none;
  }
  .scroll-hint.visible { opacity: 1; }
  .scroll-hint.hidden { opacity: 0; }
  .chevron-anim {
    width: 20px; height: 20px; border-right: 1.5px solid rgba(255,255,255,0.6);
    border-bottom: 1.5px solid rgba(255,255,255,0.6);
    transform: rotate(45deg);
    animation: bounce 1.8s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.5; }
    50% { transform: rotate(45deg) translateY(4px); opacity: 1; }
  }

  /* ── JOURNEY MODE ── */
  .journey-screen {
    min-height: 100vh; background: var(--off-white);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 80px 24px 48px;
  }
  .journey-header {
    text-align: center; margin-bottom: 56px;
  }
  .journey-eyebrow {
    font-family: var(--font-body); font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--green-deep);
    margin-bottom: 16px;
  }
  .journey-title {
    font-family: var(--font-display); font-size: clamp(32px, 4vw, 52px);
    font-weight: 300; color: var(--dark); line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .journey-title em { font-style: italic; color: var(--amber); }

  .progress-dots {
    display: flex; gap: 10px; justify-content: center; margin-bottom: 48px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mist); transition: all 0.3s var(--ease-out);
  }
  .dot.active { background: var(--green-deep); transform: scale(1.2); }
  .dot.done { background: var(--green-mid); }

  .q-cards {
    display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
    max-width: 720px; width: 100%;
  }
  .q-card {
    padding: 16px 28px; border-radius: var(--radius);
    border: 1.5px solid var(--stone);
    background: white;
    font-family: var(--font-body); font-size: 15px; font-weight: 400; color: var(--peat);
    cursor: pointer; transition: all 0.2s var(--ease-out);
    box-shadow: var(--shadow-card);
  }
  .q-card:hover {
    border-color: var(--green-mid); color: var(--green-deep);
    transform: translateY(-2px); box-shadow: var(--shadow-soft);
  }
  .q-card.selected {
    border-color: var(--green-deep); background: var(--green-light);
    color: var(--green-deep); font-weight: 500;
  }
  .q-card.interest-card {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 18px 20px; min-width: 120px; text-align: center;
  }
  .q-card.interest-card .card-icon { font-size: 24px; }
  .q-card.interest-card .card-label { font-size: 13px; }

  .journey-next-btn {
    margin-top: 40px; padding: 16px 48px;
    background: var(--green-deep); color: white;
    border: none; border-radius: 100px;
    font-family: var(--font-body); font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .journey-next-btn:hover { background: var(--peat); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(61,107,71,0.3); }
  .journey-next-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  .journey-back {
    margin-top: 20px; background: none; border: none;
    color: var(--slate); font-size: 13px; cursor: pointer;
    font-family: var(--font-body); letter-spacing: 0.04em;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ── PLANNING WORKSPACE ── */
  .workspace {
    display: flex; height: 100vh; overflow: hidden;
    background: var(--off-white);
  }

  /* Left panel — journey drawer */
  .journey-panel {
    width: 340px; min-width: 340px;
    background: white;
    border-right: 1px solid var(--stone);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(28,26,24,0.06);
    z-index: 20; overflow: hidden;
  }
  .panel-header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--stone);
    background: white;
  }
  .panel-eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--green-deep); margin-bottom: 6px;
  }
  .panel-title {
    font-family: var(--font-display); font-size: 22px; font-weight: 500;
    color: var(--dark); line-height: 1.2;
  }
  .panel-subtitle {
    font-size: 12px; color: var(--slate); margin-top: 4px;
  }

  .journey-stops {
    flex: 1; overflow-y: auto; padding: 16px;
  }
  .journey-empty {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 200px;
    color: var(--slate); text-align: center; gap: 12px;
  }
  .journey-empty-icon { font-size: 36px; opacity: 0.4; }
  .journey-empty p { font-size: 13px; line-height: 1.6; max-width: 200px; }

  .journey-stop {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--stone);
    animation: slideIn 0.3s var(--ease-out);
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

  .stop-number {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--green-deep); color: white;
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }
  .stop-info { flex: 1; min-width: 0; }
  .stop-name { font-size: 14px; font-weight: 500; color: var(--dark); }
  .stop-region { font-size: 11px; color: var(--slate); margin-top: 2px; }
  .stop-time { font-size: 11px; color: var(--green-deep); font-weight: 500; margin-top: 3px; }
  .stop-remove {
    background: none; border: none; color: var(--mist); cursor: pointer;
    font-size: 16px; padding: 2px; line-height: 1;
    transition: color 0.15s;
  }
  .stop-remove:hover { color: #c0392b; }

  .drive-time-between {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 0 6px 14px; color: var(--slate); font-size: 11px;
  }
  .drive-line { flex: 1; height: 1px; background: var(--stone); }
  .drive-icon { font-size: 12px; }

  .journey-summary {
    padding: 16px 24px; border-top: 1px solid var(--stone);
    background: var(--off-white);
  }
  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--slate); margin-bottom: 6px;
  }
  .summary-total {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 600; color: var(--dark);
    padding-top: 8px; border-top: 1px solid var(--stone);
  }
  .save-journey-btn {
    width: 100%; margin-top: 14px; padding: 13px;
    background: var(--amber); color: white; border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body); font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }
  .save-journey-btn:hover { background: #b0761f; }

  /* Sign-in nudge */
  .signin-nudge {
    margin: 12px 0 0;
    padding: 12px 14px;
    background: var(--amber-pale); border-radius: var(--radius-sm);
    border: 1px solid var(--amber-light);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .nudge-icon { font-size: 16px; margin-top: 1px; }
  .nudge-text { font-size: 12px; color: var(--peat); line-height: 1.5; }
  .nudge-text strong { color: var(--amber); }
  .nudge-btn {
    display: inline-block; margin-top: 6px; padding: 6px 14px;
    background: white; border: 1px solid var(--amber);
    border-radius: 100px; font-size: 11px; font-weight: 500;
    color: var(--amber); cursor: pointer; transition: all 0.15s;
  }
  .nudge-btn:hover { background: var(--amber); color: white; }

  /* Map area */
  .map-area {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .map-toolbar {
    padding: 14px 20px; background: white;
    border-bottom: 1px solid var(--stone);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    z-index: 10;
  }
  .filter-btn {
    padding: 7px 16px; border-radius: 100px;
    border: 1.5px solid var(--stone);
    background: white; color: var(--peat);
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.18s; display: flex; align-items: center; gap: 6px;
  }
  .filter-btn:hover { border-color: var(--green-mid); color: var(--green-deep); }
  .filter-btn.active {
    background: var(--green-deep); color: white; border-color: var(--green-deep);
  }
  .filter-sep { width: 1px; height: 20px; background: var(--stone); }
  .map-hint {
    font-size: 12px; color: var(--slate); margin-left: auto;
    display: flex; align-items: center; gap: 6px;
  }

  #map { flex: 1; z-index: 1; }

  /* Leaflet custom markers */
  .distillery-marker {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--green-deep); border: 2.5px solid white;
    box-shadow: 0 2px 8px rgba(61,107,71,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
    transition: transform 0.2s;
  }
  .distillery-marker:hover { transform: scale(1.1); }
  .distillery-marker.in-journey {
    background: var(--amber); border-color: white;
    box-shadow: 0 2px 8px rgba(196,134,42,0.5);
  }
  .attr-marker {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid white;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(28,26,24,0.2);
  }

  /* Leaflet popup override */
  .leaflet-popup-content-wrapper {
    border-radius: var(--radius) !important;
    box-shadow: var(--shadow-soft) !important;
    border: 1px solid var(--stone) !important;
    padding: 0 !important;
    overflow: hidden !important;
  }
  .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
  .leaflet-popup-tip-container { display: none; }
  .popup-inner { padding: 16px; }
  .popup-tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--green-deep); margin-bottom: 6px;
  }
  .popup-name {
    font-family: var(--font-display); font-size: 18px; font-weight: 500;
    color: var(--dark); margin-bottom: 4px; line-height: 1.2;
  }
  .popup-region { font-size: 12px; color: var(--slate); margin-bottom: 10px; }
  .popup-detail { font-size: 12px; color: var(--peat); line-height: 1.5; margin-bottom: 10px; }
  .popup-actions { display: flex; gap: 8px; }
  .popup-btn {
    flex: 1; padding: 9px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: none; transition: all 0.15s; text-align: center;
  }
  .popup-btn-primary { background: var(--green-deep); color: white; }
  .popup-btn-primary:hover { background: var(--peat); }
  .popup-btn-secondary { background: var(--stone); color: var(--peat); }
  .popup-btn-secondary:hover { background: var(--mist); }

  /* ── DISTILLERY PAGE ── */
  .distillery-page {
    height: 100vh; overflow-y: auto; background: var(--off-white);
  }
  .distillery-hero {
    position: relative; height: 55vh; min-height: 360px;
    display: flex; align-items: flex-end;
    overflow: hidden;
  }
  .distillery-hero-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .distillery-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(28,26,24,0.75) 0%, rgba(28,26,24,0.1) 60%);
  }
  .distillery-hero-content {
    position: relative; z-index: 2; padding: 40px 48px; width: 100%;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .distillery-back {
    position: absolute; top: 24px; left: 24px; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white; border-radius: 100px;
    padding: 9px 18px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s; text-decoration: none;
  }
  .distillery-back:hover { background: rgba(255,255,255,0.25); }

  .distillery-hero-title {
    font-family: var(--font-display); font-size: clamp(36px, 5vw, 64px);
    font-weight: 300; color: white; line-height: 1.05;
  }
  .distillery-hero-sub {
    font-size: 14px; color: rgba(255,255,255,0.75); margin-top: 6px;
    display: flex; align-items: center; gap: 12px;
  }
  .hero-badge {
    padding: 4px 12px; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.4);
    font-size: 11px; color: rgba(255,255,255,0.85);
  }
  .distillery-hero-actions {
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .hero-action-btn {
    padding: 12px 24px; border-radius: 100px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: none; transition: all 0.2s; white-space: nowrap;
  }
  .hero-action-primary { background: var(--amber); color: white; }
  .hero-action-primary:hover { background: #b0761f; }
  .hero-action-secondary {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.4); color: white;
  }
  .hero-action-secondary:hover { background: rgba(255,255,255,0.25); }
  .hero-action-secondary.in-journey { background: var(--green-deep); border-color: var(--green-deep); }

  .distillery-body { max-width: 1100px; margin: 0 auto; padding: 48px 48px 80px; }
  .dist-grid { display: grid; grid-template-columns: 1fr 320px; gap: 48px; align-items: start; }

  .dist-section { margin-bottom: 40px; }
  .dist-section-title {
    font-family: var(--font-display); font-size: 24px; font-weight: 500;
    color: var(--dark); margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--stone);
  }
  .dist-p { font-size: 14px; color: var(--peat); line-height: 1.75; }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .info-item { background: white; border-radius: var(--radius-sm); padding: 14px 16px; border: 1px solid var(--stone); }
  .info-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--slate); margin-bottom: 4px; }
  .info-value { font-size: 14px; color: var(--dark); font-weight: 500; }

  .tour-card {
    background: white; border: 1px solid var(--stone); border-radius: var(--radius);
    padding: 20px; margin-bottom: 12px;
  }
  .tour-name { font-size: 15px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
  .tour-detail { font-size: 13px; color: var(--slate); margin-bottom: 10px; }
  .tour-price { font-size: 16px; font-weight: 600; color: var(--green-deep); }
  .tour-book {
    float: right; padding: 8px 20px; background: var(--green-deep);
    color: white; border: none; border-radius: 100px;
    font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .tour-book:hover { background: var(--peat); }

  .nearby-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .nearby-card {
    background: white; border: 1px solid var(--stone); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: all 0.2s;
  }
  .nearby-card:hover { border-color: var(--green-mid); transform: translateY(-2px); box-shadow: var(--shadow-card); }
  .nearby-icon { font-size: 22px; margin-bottom: 8px; }
  .nearby-name { font-size: 13px; font-weight: 600; color: var(--dark); margin-bottom: 3px; }
  .nearby-type { font-size: 11px; color: var(--slate); margin-bottom: 6px; }
  .nearby-dist { font-size: 11px; color: var(--green-deep); font-weight: 500; }

  /* Sidebar card */
  .dist-sidebar { position: sticky; top: 0; display: flex; flex-direction: column; gap: 16px; }
  .sidebar-card {
    background: white; border: 1px solid var(--stone); border-radius: var(--radius);
    padding: 20px;
  }
  .sidebar-card-title {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;

  'caol_ila-bunnahabhain': 12, 'bunnahabhain-ardnahoe': 8, 'caol_ila-ardnahoe': 6,
  'ardbeg-bowmore': 25, 'lagavulin-bowmore': 22, 'laphroaig-caol_ila': 35,
  'kilchoman-caol_ila': 38, 'bruichladdich-caol_ila': 28,
};

function getDriveTime(a, b) {
  const key1 = `${a}-${b}`;
  const key2 = `${b}-${a}`;
  return DRIVE_TIMES[key1] || DRIVE_TIMES[key2] || 30;
}

function getJourneyName(stops) {
  const key = stops.map(s => s.id).join(',');
  return JOURNEY_NAMES[key] || JOURNEY_NAMES['default'];
}

// ── JOURNEY MODE ──────────────────────────────────────────────────────────────
function JourneyMode({ initialAnswer, onComplete }) {
  const [step, setStep] = useState(1);
  const [answers, setAnswers] = useState({ timeframe: initialAnswer.timeframe, mode: initialAnswer.mode, fast: false });

  const questions = [
    {
      id: 'start',
      q: 'Where will your journey start?',
      hint: 'We\'ll centre your map here',
      options: ['Port Ellen (Ferry Terminal)', 'Port Askaig (Ferry Terminal)', 'Bowmore (Town Centre)', 'I\'m already on Islay'],
    },
    {
      id: 'duration',
      q: 'How long will your adventure last?',
      hint: 'We\'ll suggest the right number of distilleries',
      options: ['Day trip', 'Weekend', '3–5 days', 'One week or more'],
    },
    {
      id: 'interests',
      q: 'What would make this the perfect whisky adventure?',
      hint: 'Choose everything that excites you',
      multi: true,
      options: [
        { label: 'Legendary Distilleries', icon: '🏆' },
        { label: 'Hidden Gems', icon: '💎' },
        { label: 'Warehouse Tastings', icon: '🪣' },
        { label: 'Peated Whisky', icon: '💨' },
        { label: 'Scenic Drives', icon: '🛣️' },
        { label: 'Photography', icon: '📷' },
        { label: 'Beaches', icon: '🏖️' },
        { label: 'Walking & Hiking', icon: '🥾' },
        { label: 'Historic Sites', icon: '🏛️' },
        { label: 'Local Food', icon: '🍽️' },
        { label: 'Luxury Stays', icon: '🛏️' },
        { label: 'Dog Friendly', icon: '🐕' },
        { label: 'Family Friendly', icon: '👨‍👩‍👧' },
        { label: 'Independent Distilleries', icon: '🌿' },
      ],
    },
  ];

  const current = questions[step - 1];
  const isMulti = current.multi;
  const selected = answers[current.id] || (isMulti ? [] : null);

  function select(opt) {
    if (isMulti) {
      const label = typeof opt === 'object' ? opt.label : opt;
      const arr = selected.includes(label) ? selected.filter(x => x !== label) : [...selected, label];
      setAnswers({ ...answers, [current.id]: arr });
    } else {
      setAnswers({ ...answers, [current.id]: opt });
    }
  }

  function canContinue() {
    if (isMulti) return selected.length > 0;
    return !!answers[current.id];
  }

  function next() {
    if (step < questions.length) setStep(step + 1);
    else onComplete(answers);
  }

  const totalSteps = questions.length + 1;
  const currentDot = step;

  return (
    <div className="journey-screen page">
      <nav className="journey-nav">
        <div className="journey-nav-logo">
          <Logo color="#3D6B47" size={28}/>
          <span style={{fontFamily:'var(--font-display)',fontSize:'16px',color:'var(--dark)',marginLeft:'8px'}}>Scotland Whisky Trails</span>
        </div>
        <div className="progress-dots">
          {[...Array(totalSteps)].map((_, i) => (
            <div key={i} className={`dot${i < currentDot ? ' done' : i === currentDot ? ' active' : ''}`}/>
          ))}
        </div>
      </nav>

      <div className="journey-header">
        <div className="journey-eyebrow">Building your journey — step {step + 1} of {totalSteps}</div>
        <h2 className="journey-title">{current.q}</h2>
        {current.hint && <p style={{fontSize:'14px',color:'var(--slate)',marginTop:'8px'}}>{current.hint}</p>}
      </div>

      <div className="q-cards">
        {current.options.map(opt => {
          const label = typeof opt === 'object' ? opt.label : opt;
          const icon = typeof opt === 'object' ? opt.icon : null;
          const isSelected = isMulti ? selected.includes(label) : answers[current.id] === label;

          return (
            <button
              key={label}
              className={`q-card${icon ? ' interest-card' : ''}${isSelected ? ' selected' : ''}`}
              onClick={() => select(opt)}
            >
              {icon && <span className="card-icon">{icon}</span>}
              <span className={icon ? 'card-label' : ''}>{label}</span>
            </button>
          );
        })}
      </div>

      <button className="journey-next-btn" onClick={next} disabled={!canContinue()}>
        {step < questions.length ? 'Continue →' : 'Show me my journey →'}
      </button>
      {step > 1 && (
        <button className="journey-back" onClick={() => setStep(step - 1)}>← Back</button>
      )}
    </div>
  );
}

// ── PLANNING WORKSPACE ────────────────────────────────────────────────────────
function PlanningWorkspace({ journeyAnswers, journey: journeyProp, onDistilleryClick, onAddToJourney: onAddToJourneyProp }) {
  const isFastMode = journeyAnswers?.fast === true;
  const mapRef = useRef(null);
  const leafletMap = useRef(null);
  const markersRef = useRef({});
  const [journey, setJourney] = useState(journeyProp || []);
  // If fast mode (today/this weekend), default filter to open_today
  const [activeFilter, setActiveFilter] = useState(isFastMode ? 'open_today' : 'all');
  const [attrMarkers, setAttrMarkers] = useState([]);
  const [showNudge, setShowNudge] = useState(false);

  // Determine which distilleries are "open today" based on day of week
  const today = new Date();
  const dayName = today.toLocaleDateString('en-GB', { weekday: 'long' }); // e.g. "Monday"
  const isWeekday = today.getDay() >= 1 && today.getDay() <= 5;
  const isSaturday = today.getDay() === 6;
  const isSunday = today.getDay() === 0;

  function isOpenToday(d) {
    const h = d.hours.toLowerCase();
    if (h.includes('mon–sun') || h.includes('mon-sun')) return true;
    if (isSunday && (h.includes('sun') || h.includes('sun:'))) return true;
    if (isSaturday && h.includes('sat')) return true;
    if (isWeekday && (h.includes('mon–fri') || h.includes('mon-fri') || h.includes('mon–sat') || h.includes('mon-sat'))) return true;
    return false;
  }

  const filters = [
    { id: 'all', label: 'All', icon: '🗺️' },
    { id: 'open_today', label: `Open Today (${dayName})`, icon: '✅' },
    { id: 'distillery', label: 'Distilleries', icon: '🥃' },
    { id: 'beach', label: 'Beaches', icon: '🏖️' },
    { id: 'walk', label: 'Walks', icon: '🚶' },
    { id: 'viewpoint', label: 'Viewpoints', icon: '🌅' },
    { id: 'attraction', label: 'Attractions', icon: '🏛️' },
    { id: 'food', label: 'Food', icon: '🍽️' },
    { id: 'accommodation', label: 'Stays', icon: '🏨' },
  ];

  useEffect(() => {
    if (leafletMap.current) return;
    leafletMap.current = L.map(mapRef.current, {
      center: [55.77, -6.28], zoom: 11,
      zoomControl: false,
    });
    L.control.zoom({ position: 'bottomright' }).addTo(leafletMap.current);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CartoDB',
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(leafletMap.current);

    // Add distillery markers
    DISTILLERIES.forEach(d => {
      const el = document.createElement('div');
      el.className = 'distillery-marker';
      el.innerHTML = '🥃';
      el.title = d.name;
      el.dataset.distilleryId = d.id;

      const icon = L.divIcon({ html: el, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });
      const marker = L.marker([d.lat, d.lng], { icon })
        .addTo(leafletMap.current)
        .bindPopup(buildPopup(d), { maxWidth: 260, closeButton: false });

      marker.on('popupopen', () => {
        setTimeout(() => {
          const addBtn = document.getElementById(`add-${d.id}`);
          const viewBtn = document.getElementById(`view-${d.id}`);
          if (addBtn) addBtn.onclick = () => { addToJourney(d); marker.closePopup(); };
          if (viewBtn) viewBtn.onclick = () => onDistilleryClick(d);
        }, 50);
      });

      markersRef.current[d.id] = { marker, el };
    });

    // Add attraction markers
    const attrMarkerList = [];
    ATTRACTIONS.forEach(a => {
      const attrEl = document.createElement('div');
      attrEl.className = 'attr-marker';
      attrEl.innerHTML = a.icon;
      attrEl.style.background = getCategoryColor(a.category);
      attrEl.title = a.name;

      const icon = L.divIcon({ html: attrEl, className: '', iconSize: [28, 28], iconAnchor: [14, 14] });
      const m = L.marker([a.lat, a.lng], { icon })
        .bindPopup(`<div class="popup-inner"><div class="popup-tag">${a.type}</div><div class="popup-name">${a.name}</div><div class="popup-detail">${a.desc}</div></div>`, { maxWidth: 220, closeButton: false });

      attrMarkerList.push({ marker: m, category: a.category });
    });
    setAttrMarkers(attrMarkerList);

  }, []);

  function getCategoryColor(cat) {
    const colors = { beach: '#4A9CC4', walk: '#7A9B76', viewpoint: '#C4862A', attraction: '#8B6BA8', food: '#C47A4A', accommodation: '#4A7EA8' };
    return colors[cat] || '#8A8680';
  }

  function buildPopup(d) {
    const inJourney = journey.some(s => s.id === d.id);
    return `<div class="popup-inner">
      <div class="popup-tag">${d.style}</div>
      <div class="popup-name">${d.name}</div>
      <div class="popup-region">${d.region} · Est. ${d.founded}</div>
      <div class="popup-detail">${d.tagline}</div>
      <div class="popup-actions">
        <button class="popup-btn popup-btn-secondary" id="view-${d.id}">View →</button>
        <button class="popup-btn popup-btn-primary" id="add-${d.id}">${inJourney ? '✓ Added' : '+ Add to Journey'}</button>
      </div>
    </div>`;
  }

  function addToJourney(d) {
    setJourney(prev => {
      if (prev.some(s => s.id === d.id)) return prev;
      const next = [...prev, d];
      const m = markersRef.current[d.id];
      if (m) m.el.classList.add('in-journey');
      if (next.length === 3) setTimeout(() => setShowNudge(true), 600);
      return next;
    });
    if (onAddToJourneyProp) onAddToJourneyProp(d);
  }

  function removeFromJourney(id) {
    setJourney(prev => {
      const m = markersRef.current[id];
      if (m) m.el.classList.remove('in-journey');
      return prev.filter(s => s.id !== id);
    });
    if (journey.length <= 3) setShowNudge(false);
  }

  // Apply open_today visual filter to distillery markers
  useEffect(() => {
    DISTILLERIES.forEach(d => {
      const m = markersRef.current[d.id];
      if (!m) return;
      if (activeFilter === 'open_today') {
        const open = isOpenToday(d);
        m.el.style.opacity = open ? '1' : '0.35';
        m.el.style.filter = open ? 'none' : 'grayscale(100%)';
        m.el.title = open ? `${d.name} — Open today` : `${d.name} — Closed today`;
      } else {
        m.el.style.opacity = '1';
        m.el.style.filter = 'none';
        m.el.title = d.name;
      }
    });
  }, [activeFilter]);

  // Filter attraction markers
  useEffect(() => {
    attrMarkers.forEach(({ marker, category }) => {
      const showAll = activeFilter === 'all' || activeFilter === 'open_today';
      const showDistOnly = activeFilter === 'distillery';
      const showThisCat = activeFilter === category;

      if (showAll && !showDistOnly) {
        if (!leafletMap.current.hasLayer(marker)) marker.addTo(leafletMap.current);
      } else if (showDistOnly) {
        if (leafletMap.current.hasLayer(marker)) marker.remove();
      } else if (showThisCat) {
        if (!leafletMap.current.hasLayer(marker)) marker.addTo(leafletMap.current);
      } else {
        if (leafletMap.current.hasLayer(marker)) marker.remove();
      }
    });
  }, [activeFilter, attrMarkers]);

  // Compute total drive time
  const totalDriveTime = journey.length < 2 ? 0 : journey.reduce((acc, stop, i) => {
    if (i === 0) return 0;
    return acc + getDriveTime(journey[i-1].id, stop.id);
  }, 0);
  const totalVisitTime = journey.length * 90; // avg 1.5 hrs
  const totalMinutes = totalDriveTime + totalVisitTime;

  function formatTime(mins) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return h > 0 ? `${h}h ${m > 0 ? m + 'm' : ''}`.trim() : `${m}m`;
  }

  const journeyName = getJourneyName(journey);

  return (
    <div className="workspace page">
      {/* Left panel */}
      <div className="journey-panel">
        <div className="panel-header">
          <div className="panel-eyebrow">My Whisky Journey</div>
          <div className="panel-title">{journey.length > 0 ? journeyName : 'Your Journey'}</div>
          <div className="panel-subtitle">
            {journey.length === 0 ? 'Tap a distillery on the map to begin' : `${journey.length} stop${journey.length > 1 ? 's' : ''} added`}
          </div>
        </div>

        <div className="journey-stops">
          {journey.length === 0 && (
            <div className="journey-empty">
              <div className="journey-empty-icon">🥃</div>
              <p>Your distilleries will appear here as you add them from the map.</p>
            </div>
          )}
          {journey.map((stop, i) => (
            <React.Fragment key={stop.id}>
              {i > 0 && (
                <div className="drive-time-between">
                  <span className="drive-icon">🚗</span>
                  <span>{formatTime(getDriveTime(journey[i-1].id, stop.id))} drive</span>
                  <div className="drive-line"/>
                </div>
              )}
              <div className="journey-stop">
                <div className="stop-number">{i + 1}</div>
                <div className="stop-info">
                  <div className="stop-name">{stop.name}</div>
                  <div className="stop-region">{stop.region} · {stop.style}</div>
                  <div className="stop-time">~{stop.avg_visit} visit</div>
                </div>
                <button className="stop-remove" onClick={() => removeFromJourney(stop.id)}>×</button>
              </div>
            </React.Fragment>
          ))}

          {showNudge && (
            <div className="signin-nudge">
              <span className="nudge-icon">💾</span>
              <div className="nudge-text">
                <strong>Save your journey across devices?</strong><br/>
                Sign in to pick up where you left off — on any device, any time.
                <br/>
                <button className="nudge-btn">Continue with Google</button>
              </div>
            </div>
          )}
        </div>

        {journey.length > 0 && (
          <div className="journey-summary">
            <div className="summary-row">
              <span>Driving time</span>
              <span>{formatTime(totalDriveTime)}</span>
            </div>
            <div className="summary-row">
              <span>Estimated visits</span>
              <span>{formatTime(totalVisitTime)}</span>
            </div>
            <div className="summary-total">
              <span>Total journey</span>
              <span>{formatTime(totalMinutes)}</span>
            </div>
            <button className="save-journey-btn">📋 Save My Journey</button>
          </div>
        )}
      </div>

      {/* Map area */}
      <div className="map-area">
        <div className="map-toolbar">
          {filters.map(f => (
            <button
              key={f.id}
              className={`filter-btn${activeFilter === f.id ? ' active' : ''}`}
              onClick={() => setActiveFilter(f.id)}
            >
              {f.icon} {f.label}
            </button>
          ))}
          <div className="filter-sep"/>
          <span className="map-hint">
            {activeFilter === 'open_today'
              ? `✅ Showing distilleries open on ${dayName} — greyed out are closed`
              : '🥃 Tap a distillery to add to your journey'}
          </span>
        </div>
        <div id="map" ref={mapRef}/>
      </div>
    </div>
  );
}

                <div className="info-item">
                  <div className="info-label">Motorhome Friendly</div>
                  <div className="info-value">{d.motorhome ? '✓ Yes' : '✗ No'}</div>
                </div>
                {d.restaurant && (
                  <div className="info-item" style={{gridColumn:'1/-1'}}>
                    <div className="info-label">On-site Dining</div>
                    <div className="info-value">{d.restaurant}</div>
                  </div>
                )}
              </div>
            </div>

            {/* Tours */}
            <div className="dist-section">
              <h2 className="dist-section-title">Tours & Experiences</h2>
              {d.tours.map(t => (
                <div className="tour-card" key={t.name}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                    <div>
                      <div className="tour-name">{t.name}</div>
                      <div className="tour-detail">{t.duration} · {t.description}</div>
                      <div className="tour-price">{t.price} per person</div>
                    </div>
                    <button className="tour-book" onClick={() => window.open('#','_blank')}>
                      Book ↗
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Nearby */}
            <div className="dist-section">
              <h2 className="dist-section-title">Nearby Experiences</h2>
              <div className="nearby-grid">
                {d.nearby.map(n => (
                  <div className="nearby-card" key={n.name}>
                    <div className="nearby-icon">{n.icon}</div>
                    <div className="nearby-name">{n.name}</div>
                    <div className="nearby-type">{n.type}</div>
                    <div className="nearby-dist">{n.dist}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Sidebar */}
          <div className="dist-sidebar">
            <div className="sidebar-card">
              <div className="sidebar-card-title">Facilities</div>
              <div className="facilities-grid">
                {d.facilities.map(f => (
                  <span className="facility-badge" key={f}>{f}</span>
                ))}
              </div>
            </div>

            {nextStops.length > 0 && (
              <div className="sidebar-card">
                <div className="sidebar-card-title">Suggested Next Stops</div>
                {nextStops.map(ns => (
                  <div className="next-stop-card" key={ns.id} onClick={() => onAddToJourney(ns)}>
                    <span className="next-stop-icon">🥃</span>
                    <div>
                      <div className="next-stop-name">{ns.name}</div>
                      <div className="next-stop-dist">{getDriveTime(d.id, ns.id)} min drive · {ns.style}</div>
                    </div>
                    <span className="next-stop-add">+</span>
                  </div>
                ))}
              </div>
            )}

            <div className="sidebar-card" style={{background:'var(--amber-pale)',border:'1px solid var(--amber-light)'}}>
              <div className="sidebar-card-title" style={{color:'var(--amber)'}}>Exclusive Offer</div>
              <p style={{fontSize:'13px',color:'var(--peat)',lineHeight:'1.6',marginBottom:'12px'}}>
                Scotland Whisky Trails members receive 10% off {d.name} tours when booked through this platform.
              </p>
              <button style={{
                width:'100%',padding:'10px',background:'var(--amber)',color:'white',
                border:'none',borderRadius:'var(--radius-sm)',fontSize:'13px',
                fontWeight:'500',cursor:'pointer'
              }}>
                View Exclusive Offers →
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home'); // home | journey | workspace | distillery
  const [journeyAnswers, setJourneyAnswers] = useState(null);
  const [selectedDistillery, setSelectedDistillery] = useState(null);
  const [journeyStops, setJourneyStops] = useState([]);

  // Load from localStorage
  useEffect(() => {
    try {
      const saved = localStorage.getItem('swt_journey');
      if (saved) setJourneyStops(JSON.parse(saved));
    } catch(e) {}
  }, []);

  // Save to localStorage
  useEffect(() => {
    localStorage.setItem('swt_journey', JSON.stringify(journeyStops));
  }, [journeyStops]);

  function handleHomeBegin(answers) {
    setJourneyAnswers(answers);
    if (answers.fast) {
      // Today / this weekend — skip question flow, go straight to map
      setScreen('workspace');
    } else {
      setScreen('journey');
    }
  }

  function handleJourneyComplete(answers) {
    setJourneyAnswers(answers);
    setScreen('workspace');
  }

  function handleDistilleryClick(d) {
    setSelectedDistillery(d);
    setScreen('distillery');
  }

  function handleAddToJourney(d) {
    setJourneyStops(prev => prev.some(s => s.id === d.id) ? prev : [...prev, d]);
  }

  return (
    <>
      {screen === 'home' && <HomePage onBegin={handleHomeBegin}/>}
      {screen === 'journey' && (
        <JourneyMode
          initialAnswer={journeyAnswers}
          onComplete={handleJourneyComplete}
        />
      )}
      {screen === 'workspace' && (
        <PlanningWorkspace
          journeyAnswers={journeyAnswers}
          journey={journeyStops}
          onDistilleryClick={handleDistilleryClick}
          onAddToJourney={handleAddToJourney}
        />
      )}
      {screen === 'distillery' && selectedDistillery && (
        <DistilleryPage
          distillery={selectedDistillery}
          journey={journeyStops}
          onBack={() => setScreen('workspace')}
          onAddToJourney={handleAddToJourney}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
